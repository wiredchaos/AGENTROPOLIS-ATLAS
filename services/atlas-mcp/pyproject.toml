[project]
name = "agentropolis-atlas-mcp"
version = "0.1.0"
description = "Governed geospatial MCP gateway for AGENTROPOLIS-ATLAS"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.27,<2",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
]

[project.scripts]
atlas-mcp = "atlas_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/atlas_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
