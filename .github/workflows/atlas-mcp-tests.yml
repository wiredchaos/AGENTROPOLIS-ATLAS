name: ATLAS MCP Tests

on:
  pull_request:
    paths:
      - "services/atlas-mcp/**"
      - ".github/workflows/atlas-mcp-tests.yml"
  push:
    branches: [main]
    paths:
      - "services/atlas-mcp/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: services/atlas-mcp
        run: uv sync --extra dev
      - name: Run tests
        working-directory: services/atlas-mcp
        run: uv run pytest
